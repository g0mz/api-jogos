<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha estante de jogos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --fundo: #1C1530;
            --superficie: #271E40;
            --linha: #4A3D70;
            --borda: #7A6CA3;
            --texto: #F1ECFA;
            --texto-suave: #A79BC4;
            --destaque: #FFB547;
            --destaque-claro: #FFC56E;
            --perigo: #FF7A7A;
        }

        * { box-sizing: border-box; }

        ::selection {
            background: var(--destaque);
            color: var(--fundo);
        }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--texto);
            font-family: "Chakra Petch", "Segoe UI", Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 16px 64px;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.1;
            margin: 0 0 24px;
            letter-spacing: -0.01em;
        }

        h2 {
            font-size: 1.25rem;
            margin: 40px 0 12px;
        }

        /* Barra de progresso: um segmento por jogo, dourado quando zerado */
        .progresso {
            display: flex;
            gap: 4px;
            height: 14px;
        }
        .progresso span {
            flex: 1;
            background: var(--linha);
        }
        .progresso span.cheio { background: var(--destaque); }

        #resumo {
            margin: 8px 0 0;
            color: var(--texto-suave);
        }

        /* Formulário */
        form {
            display: grid;
            grid-template-columns: 2fr 1.4fr 0.9fr auto;
            gap: 12px;
            align-items: end;
            background: var(--superficie);
            padding: 16px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            color: var(--texto-suave);
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            min-height: 44px;
            padding: 8px 10px;
            font: inherit;
            color: var(--texto);
            background: var(--fundo);
            border: 1px solid var(--borda);
            caret-color: var(--destaque);
        }

        button {
            min-height: 44px;
            padding: 8px 14px;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--borda);
            background: transparent;
            color: var(--texto);
            transition: background-color 150ms ease, border-color 150ms ease;
        }
        button:hover { border-color: var(--texto-suave); }

        .principal {
            background: var(--destaque);
            border-color: var(--destaque);
            color: var(--fundo);
            font-weight: 700;
        }
        .principal:hover {
            background: var(--destaque-claro);
            border-color: var(--destaque-claro);
        }

        .excluir { color: var(--perigo); }
        .excluir:hover { border-color: var(--perigo); }

        button:disabled {
            opacity: 0.55;
            cursor: progress;
        }

        input:focus-visible,
        button:focus-visible,
        h2:focus-visible {
            outline: 3px solid var(--destaque);
            outline-offset: 2px;
        }

        #mensagem {
            min-height: 1.5em;
            margin: 10px 0 0;
            color: var(--perigo);
        }

        /* Lista */
        #lista {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .jogo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--superficie);
            margin-bottom: 8px;
        }
        .marca {
            flex: none;
            width: 14px;
            height: 14px;
            border: 2px solid var(--borda);
        }
        .jogo.zerado .marca {
            background: var(--destaque);
            border-color: var(--destaque);
        }
        .info { flex: 1; min-width: 0; }
        .titulo {
            display: block;
            font-weight: 700;
            font-size: 1.125rem;
            overflow-wrap: anywhere;
        }
        .detalhes {
            color: var(--texto-suave);
            font-size: 0.9375rem;
            font-variant-numeric: tabular-nums;
        }
        .acoes {
            display: flex;
            gap: 8px;
            flex: none;
        }
        .vazio { color: var(--texto-suave); }
        .falha { color: var(--perigo); }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            form { grid-template-columns: 1fr; }
            .jogo { flex-wrap: wrap; }
            .acoes { width: 100%; padding-left: 28px; }
            .acoes button { flex: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            button { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Minha estante de jogos</h1>
        <div class="progresso" id="progresso" aria-hidden="true"></div>
        <p id="resumo"></p>

        <h2>Cadastrar jogo</h2>
        <form id="formulario">
            <div>
                <label for="titulo">Título</label>
                <input type="text" id="titulo" autocomplete="off">
            </div>
            <div>
                <label for="plataforma">Plataforma</label>
                <input type="text" id="plataforma" autocomplete="off">
            </div>
            <div>
                <label for="ano">Ano</label>
                <input type="number" id="ano">
            </div>
            <button type="submit" class="principal">Cadastrar jogo</button>
        </form>
        <p id="mensagem" role="alert"></p>

        <h2 id="titulo-lista" tabindex="-1">Jogos</h2>
        <ul id="lista">
            <li class="vazio">Carregando jogos...</li>
        </ul>
    </main>

    <script>
        const API = "/api/jogos/";
        const lista = document.getElementById("lista");
        const formulario = document.getElementById("formulario");
        const mensagem = document.getElementById("mensagem");
        const progresso = document.getElementById("progresso");
        const resumo = document.getElementById("resumo");

        function mostrarProgresso(jogos) {
            progresso.innerHTML = "";
            let zerados = 0;
            for (const jogo of jogos) {
                const segmento = document.createElement("span");
                if (jogo.zerado) {
                    segmento.className = "cheio";
                    zerados++;
                }
                progresso.appendChild(segmento);
            }

            if (jogos.length === 0) {
                resumo.textContent = "Nenhum jogo na estante.";
            } else if (jogos.length === 1) {
                resumo.textContent = zerados + " de 1 jogo zerado";
            } else {
                resumo.textContent = zerados + " de " + jogos.length + " jogos zerados";
            }
        }

        function mostrarAviso(texto, classe) {
            lista.innerHTML = "";
            const aviso = document.createElement("li");
            aviso.className = classe;
            aviso.textContent = texto;
            lista.appendChild(aviso);
        }

        // focarId: id do jogo cujo botão "zerado" recebe o foco depois de redesenhar a lista
        async function carregarJogos(focarId) {
            let dados;
            try {
                const resposta = await fetch(API);
                dados = await resposta.json();
            } catch (erro) {
                progresso.innerHTML = "";
                resumo.textContent = "";
                mostrarAviso("Não foi possível carregar os jogos. Confira se o servidor está rodando e recarregue a página.", "falha");
                return;
            }

            mostrarProgresso(dados.jogos);
            lista.innerHTML = "";

            if (dados.jogos.length === 0) {
                mostrarAviso("Nenhum jogo cadastrado. Use o formulário acima para adicionar o primeiro.", "vazio");
                return;
            }

            for (const jogo of dados.jogos) {
                const item = document.createElement("li");
                item.className = jogo.zerado ? "jogo zerado" : "jogo";

                const marca = document.createElement("span");
                marca.className = "marca";
                marca.setAttribute("aria-hidden", "true");

                const info = document.createElement("div");
                info.className = "info";
                const titulo = document.createElement("span");
                titulo.className = "titulo";
                titulo.textContent = jogo.titulo;
                const detalhes = document.createElement("span");
                detalhes.className = "detalhes";
                detalhes.textContent = jogo.plataforma + ", " + jogo.ano
                    + (jogo.zerado ? " – zerado" : " – não zerado");
                info.append(titulo, detalhes);

                const acoes = document.createElement("div");
                acoes.className = "acoes";

                const botaoZerado = document.createElement("button");
                botaoZerado.textContent =
                    jogo.zerado ? "Desmarcar zerado" : "Marcar como zerado";
                botaoZerado.onclick = () => alterarZerado(jogo, botaoZerado);

                const botaoExcluir = document.createElement("button");
                botaoExcluir.className = "excluir";
                botaoExcluir.textContent = "Excluir";
                botaoExcluir.onclick = () => excluirJogo(jogo, botaoExcluir);

                acoes.append(botaoZerado, botaoExcluir);
                item.append(marca, info, acoes);
                lista.appendChild(item);

                if (jogo.id === focarId) {
                    botaoZerado.focus();
                }
            }
        }

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const novoJogo = {
                titulo: document.getElementById("titulo").value,
                plataforma: document.getElementById("plataforma").value,
                ano: Number(document.getElementById("ano").value),
            };

            const botao = formulario.querySelector("button");
            botao.disabled = true;
            try {
                const resposta = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(novoJogo),
                });

                if (resposta.status === 201) {
                    mensagem.textContent = "";
                    formulario.reset();
                    document.getElementById("titulo").focus();
                    carregarJogos();
                } else {
                    const dados = await resposta.json();
                    mensagem.textContent = dados.erro;
                }
            } catch (erro) {
                mensagem.textContent = "Não foi possível falar com o servidor. Tente de novo.";
            } finally {
                botao.disabled = false;
            }
        });

        async function alterarZerado(jogo, botao) {
            botao.disabled = true;
            try {
                await fetch(API + jogo.id + "/", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ zerado: !jogo.zerado }),
                });
            } catch (erro) {
                // a lista abaixo mostra o aviso de falha
            }
            carregarJogos(jogo.id);
        }

        async function excluirJogo(jogo, botao) {
            if (!confirm("Excluir \"" + jogo.titulo + "\"?")) {
                return;
            }
            botao.disabled = true;
            try {
                await fetch(API + jogo.id + "/", { method: "DELETE" });
            } catch (erro) {
                // a lista abaixo mostra o aviso de falha
            }
            await carregarJogos();
            document.getElementById("titulo-lista").focus();
        }

        carregarJogos();
    </script>
</body>
</html>
